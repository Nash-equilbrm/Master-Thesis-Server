# =============================================================================
# LiveKit Ingress config  —  DEV / LOCAL TESTING ONLY.
# Receives the FFmpeg WHIP push and republishes it into the LiveKit room.
# Must share the SAME api_key/api_secret/redis as the LiveKit server.
# -----------------------------------------------------------------------------
# Do NOT edit node_ip directly. Run `configure.bat`, which copies this file to
# `ingress.yaml` and replaces __NODE_IP__ with your LAN IPv4 (same as livekit.yaml).
# =============================================================================

log_level: info

api_key: devkey
api_secret: secretsecretsecretsecretsecret00

# Signaling path to the LiveKit server (over the docker network).
ws_url: ws://livekit:7880

redis:
  address: redis:6379

whip_port: 8080            # incoming WHIP (HTTP signaling)
rtmp_port: 1935            # incoming RTMP (unused for webcam, kept for parity)
http_relay_port: 9090      # internal: main process <-> per-session handler

rtc_config:
  use_external_ip: false
  # ICE candidates advertise this IP so FFmpeg (running on the Windows host,
  # outside Docker) can reach the ingress's WHIP media port (UDP 7885), which
  # is published 1:1 in docker-compose.yml. Without this, the ingress falls
  # back to auto-discovery and advertises an unreachable internal address,
  # causing the DTLS handshake to time out.
  node_ip: __NODE_IP__
