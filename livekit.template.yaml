# =============================================================================
# LiveKit server config  —  DEV / LOCAL TESTING ONLY (insecure default keys).
# -----------------------------------------------------------------------------
# Do NOT edit this template directly for node_ip. Run `configure.bat`, which
# copies this file to `livekit.yaml` and replaces __NODE_IP__ with your LAN IPv4.
# =============================================================================

port: 7880                 # signaling: WebSocket + HTTP API
bind_addresses:
  - ""                     # listen on all interfaces

rtc:
  tcp_port: 7881           # RTC over TCP (ICE/TCP fallback)
  udp_port: 7882           # single-port UDP mux  -> only ONE udp port to publish
  use_external_ip: false
  # node_ip MUST be reachable from the Unity host (camera + viewer machines).
  # On Docker Desktop (Windows) that means your machine's LAN IPv4 (e.g. 192.168.x.x).
  node_ip: __NODE_IP__

# DEV keys only. api_secret must be >= 32 chars. Regenerate for anything real.
keys:
  devkey: secretsecretsecretsecretsecret00

# Notifies the registration service of participant/room lifecycle events so it
# can free a cam slot when a camera disconnects, without the client having to
# call POST /unregister itself.
webhook:
  api_key: devkey
  urls:
    - http://registration:3000/webhook

logging:
  level: info
