# LiveKit + Ingress + Redis  — local dev stack for the Multi-Camera Live Stream System.
# Bring up with:  docker compose up -d   (after running configure.bat)
services:
  redis:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0
    restart: unless-stopped
    networks: [livekit]

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    depends_on: [redis]
    ports:
      - "7880:7880"          # signaling (WS / HTTP API)
      - "7881:7881"          # RTC / TCP
      - "7882:7882/udp"      # RTC / UDP (single-port mux)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks: [livekit]

  ingress:
    image: livekit/ingress:latest
    command: --config /etc/ingress.yaml
    restart: unless-stopped
    depends_on: [redis, livekit]
    environment:
      # Set by .env (written by configure.bat). The ingress advertises this IP
      # for its WHIP media so the host-side FFmpeg can reach it.
      - NODE_IP=${LIVEKIT_NODE_IP}
    ports:
      - "8080:8080"          # WHIP (HTTP signaling)
      - "1935:1935"          # RTMP
      - "7885:7885/udp"      # WHIP media (UDP)
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml:ro
    networks: [livekit]

  registration:
    build: ./registration-service
    restart: unless-stopped
    depends_on: [livekit]
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secretsecretsecretsecretsecret00
      - LIVEKIT_NODE_IP=${LIVEKIT_NODE_IP}
      - LIVEKIT_WS_PORT=7880
      - ROOM_NAME=studio
      - SLOT_COUNT=10
    ports:
      - "3000:3000"          # POST /register, POST /unregister
    networks: [livekit]

networks:
  livekit:
    driver: bridge
