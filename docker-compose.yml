# LiveKit + registration service — local dev stack for the Multi-Camera Live Stream System.
# Bring up with:  start.bat   (auto-detects LAN IP fresh, then runs docker compose up -d)
# Manual alternative: configure.bat, then  docker compose up -d
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"          # signaling (WS / HTTP API)
      - "7881:7881"          # RTC / TCP
      - "7882:7882/udp"      # RTC / UDP (single-port mux)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks: [livekit]

  registration:
    build: ./registration-service
    restart: unless-stopped
    depends_on: [livekit]
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secretsecretsecretsecretsecret00
      - LIVEKIT_NODE_IP=${LIVEKIT_NODE_IP}
      - LIVEKIT_WS_PORT=7880
      - ROOM_NAME=studio
      - SLOT_COUNT=10
    ports:
      - "3000:3000"          # POST /register, POST /unregister
    networks: [livekit]

networks:
  livekit:
    driver: bridge
